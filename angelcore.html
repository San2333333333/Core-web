<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>天使核 Angelcore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>天使核 Angelcore</h1>
  <p>天使核围绕“圣洁、温柔、飘”的感觉展开。白色的云、羽毛、逆光、雕像，整体很干净，带一点宗教元素，但更偏向唯美。</p>

  <h2>常见元素</h2>
  <ul>
    <li>蓝天白云、羽毛、光晕</li>
    <li>白色雕像、天使图案</li>
    <li>逆光的人像或剪影</li>
    <li>白色、浅蓝、浅金色的配色</li>
    <li>温柔、安静、有点神圣的感觉</li>
  </ul>


  <figure class="pic">
    <img src="pictures/angelcore1.jpg" alt="天使核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/angelcore2.jpg" alt="天使核图片2">
  </figure>

</body>
</html>
