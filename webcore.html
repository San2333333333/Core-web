<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网核 Webcore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>网核 Webcore</h1>
  <p>网核是对早期互联网的怀念。Windows 95/98 的蓝色桌面、像素图标、老式弹窗、灰色按钮，这些东西现在看起来又旧又可爱。</p>

  <h2>常见元素</h2>
  <ul>
    <li>Windows 95/98 的桌面和窗口</li>
    <li>像素图标、老式鼠标指针</li>
    <li>灰色按钮、蓝色超链接</li>
    <li>老式网页界面、访客计数器</li>
    <li>“正在加载……”之类的提示框</li>
  </ul>

  <figure class="pic">
    <img src="pictures/webcore1.jpg" alt="网核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/webcore2.jpg" alt="网核图片2">
  </figure>

</body>
</html>
