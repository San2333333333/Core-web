<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阈限空间 Liminal Space</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>阈限空间 Liminal Space</h1>
  <p>阈限空间指的是“过渡用的空间”：走廊、楼梯间、空商场、停车场。这些地方你平时不会久留，但当它们空无一人的时候，会有一种熟悉又陌生的感觉。</p>

  <h2>常见元素</h2>
  <ul>
    <li>空无一人的走廊、楼梯间</li>
    <li>没人的商场、办公室、地下停车场</li>
    <li>黄昏或深夜的光线</li>
    <li>重复的灯、地砖、门</li>
    <li>明明是熟悉的地方，却一个人也没有</li>
  </ul>


  <figure class="pic">
    <img src="pictures/liminal1.jpg" alt="阈限空间图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/liminal2.jpg" alt="阈限空间图片2">
  </figure>

  <figure class="pic">
    <img src="pictures/liminal3.jpg" alt="阈限空间图片3">
  </figure>

</body>
</html>
