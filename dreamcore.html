<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>梦核 Dreamcore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>梦核 Dreamcore</h1>
  <p>梦核是一种围绕“梦境感”的网上美学。画面常常是柔和的、过曝的、有点朦胧的，像小时候发烧时做的梦。看着熟悉，又说不上在哪里见过。</p>

  <h2>常见元素</h2>
  <ul>
    <li>过曝的天空、大朵白云</li>
    <li>空旷的房间、走廊、门</li>
    <li>童年玩具、旧卧室、游乐场</li>
    <li>眼睛、笑脸、漂浮的物体</li>
    <li>柔和的粉、蓝、白色调</li>
  </ul>


  <figure class="pic">
    <img src="pictures/dreamcore1.jpg" alt="梦核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/dreamcore2.jpg" alt="梦核图片2">
  </figure>

  <figure class="pic">
    <img src="pictures/dreamcore3.jpg" alt="梦核图片3">
  </figure>

</body>
</html>
