<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>怪核 Weirdcore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>怪核 Weirdcore</h1>
  <p>怪核的画质通常很低、很糊，画面里会出现莫名其妙的文字、眼睛、扭曲的空间。它不直接吓人，但会让人心里有点不踏实，属于“说不上来哪里奇怪”的那种。</p>

  <h2>常见元素</h2>
  <ul>
    <li>低像素、模糊、失真的照片</li>
    <li>莫名其妙的文字（比如“你在哪里？”“快醒醒”）</li>
    <li>漂浮的眼睛、笑脸、箭头</li>
    <li>扭曲的人脸或黑影</li>
    <li>普通场景里多出一样奇怪的东西</li>
  </ul>


  <figure class="pic">
    <img src="pictures/weirdcore1.jpg" alt="怪核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/weirdcore2.jpg" alt="怪核图片2">
  </figure>

  <figure class="pic">
    <img src="pictures/weirdcore3.jpg" alt="怪核图片3">
  </figure>

</body>
</html>
