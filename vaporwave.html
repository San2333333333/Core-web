<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>蒸汽波 Vaporwave</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>蒸汽波 Vaporwave</h1>
  <p>蒸汽波是一种复古怀旧的风格，主要参考 80、90 年代的电脑、广告和音乐。粉紫色的天空、大理石雕像、日文字体、老式 Windows 窗口，都是它的经典元素。</p>

  <h2>常见元素</h2>
  <ul>
    <li>粉紫色渐变天空</li>
    <li>棕榈树、大理石雕像、罗马柱</li>
    <li>老式电脑、Windows 窗口、像素图标</li>
    <li>日文字体、英文标语</li>
    <li>有点“年代感”的低画质和反光效果</li>
  </ul>

</body>
</html>
