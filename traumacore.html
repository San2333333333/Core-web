<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>伤核 TraumaCore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>伤核 TraumaCore</h1>
  <p>伤核是用“可爱、粉色、童年”的外壳，去包裹一种淡淡的难过和不安。画面通常画质很低、颜色偏粉，看着像儿童玩具或者旧照片，但情绪是安静的、有点低落的。</p>

  <h2>常见元素</h2>
  <ul>
    <li>粉色调的旧房间、旧玩具</li>
    <li>低画质、模糊的童年照片</li>
    <li>可爱的小动物、卡通角色</li>
    <li>简单的文字，比如“没事的”“会好的”</li>
    <li>可爱和忧伤混在一起的感觉</li>
  </ul>

  <figure class="pic">
    <img src="pictures/traumacore1.jpg" alt="伤核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/traumacore2.jpg" alt="伤核图片2">
  </figure>

</body>
</html>
