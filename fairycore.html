<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>童话核 Fairycore</title>
<style>
  body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#fafafa;color:#333;max-width:720px;margin:0 auto;padding:22px;line-height:1.8}
  h1{font-size:20px;border-bottom:2px solid #ccc;padding-bottom:8px;margin-top:0}
  h2{font-size:15px;color:#555;margin-top:24px}
  figure.pic{margin:16px 0;padding:10px;background:#f0f0f0;border:1px dashed #bbb;text-align:center}
  figure.pic img{display:block;width:100%;height:200px;object-fit:cover;background:#dcdcdc}
  figure.pic figcaption{font-size:12px;color:#777;line-height:1.6;margin-top:8px}
  ul{padding-left:20px}
</style>
</head>
<body>

  <h1>童话核 Fairycore</h1>
  <p>童话核是一种田园、森林系的风格，主打“像童话书里一样”的感觉。森林、蘑菇、野花、小动物、复古小屋，整体是暖色调，可爱里带一点神秘。</p>

  <h2>常见元素</h2>
  <ul>
    <li>森林小径、阳光透过树叶的光斑</li>
    <li>蘑菇、野花、苔藓、藤蔓</li>
    <li>小动物、蝴蝶、小鸟</li>
    <li>复古木屋、野餐、碎花布</li>
    <li>暖绿、米色、浅棕的配色</li>
  </ul>

  <figure class="pic">
    <img src="pictures/fairycore1.jpg" alt="童话核图片1">
  </figure>
