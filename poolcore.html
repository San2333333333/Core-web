<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>池核 Poolcore</title>
<style>
 body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>池核 Poolcore</h1>
  <p>池核主要围绕泳池、水面和瓷砖展开。空无一人的游泳池、蓝到发亮的瓷砖、水波的光影，给人一种安静又有点孤单的感觉。</p>

  <h2>常见元素</h2>
  <ul>
    <li>空游泳池、浅蓝色的水</li>
    <li>白色或浅蓝色瓷砖墙面</li>
    <li>水波倒影、水下视角</li>
    <li>淋浴间、更衣室、泳池边</li>
    <li>冷色调、有点潮湿的氛围</li>
  </ul>
  <figure class="pic">
    <img src="pictures/poolcore1.jpg" alt="池核图片1">
  </figure>

  <figure class="pic">
    <img src="pictures/poolcore2.png" alt="池核图片2">
  </figure>

  <figure class="pic">
    <img src="pictures/poolcore3.jpg" alt="池核图片3">
  </figure>

</body>
</html>
