<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>儿童核 Kidcore</title>
<style>
  body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #fafafa;
    color: #333;
    max-width: 720px;
    margin: 0 auto;
    padding: 22px;
    line-height: 1.8;
  }

  h1 { border-bottom: 2px solid #ccc; padding-bottom: 8px; margin-top: 0; }
  figure.pic {
    margin: 16px 0;
  }
   figure.pic img {display: block;width: 100%;height: auto;}

  figure.pic figcaption {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>儿童核 Kidcore</h1>
  <p>儿童核就是“把小时候的东西全摆出来”。彩色玩具、贴纸、糖果、小学课本、卡通图案，颜色很鲜艳，看起来很开心，也会让人想起自己的童年。</p>

  <h2>常见元素</h2>
  <ul>
    <li>彩色积木、玩具、贴纸</li>
    <li>小学教室、文具、课本</li>
    <li>彩虹、气球、糖果</li>
    <li>卡通图案、儿童画</li>
    <li>高饱和度的红黄蓝绿</li>
  </ul>

  <figure class="pic">
    <img src="pictures/kidcore1.jpg" alt="童核图片1" height="885">
  </figure>

  <figure class="pic">
    <img src="pictures/kidcore2.jpg" alt="童核图片2" height="1163">
  </figure>

  <figure class="pic">
    <img src="pictures/kidcore3.jpg" alt="童核图片3" height="1172">
  </figure>

</body>
</html>
